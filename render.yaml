services:
  - type: web
    name: clf-c02-drill
    runtime: static
    staticPublishPath: .
    headers:
      # one file per deploy — make sure a redeploy isn't served from cache
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
