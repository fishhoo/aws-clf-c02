services:
  - type: web
    name: clf-c02-drill
    runtime: static
    plan: free
    buildCommand: ""
    staticPublishPath: .
    headers:
      # the app is one immutable file per deploy; let the browser hold it
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
